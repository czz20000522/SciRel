name: Cross-device check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run the complete acceptance check
        run: |
          mkdir -p .runtime/tmp
          export TMPDIR="$PWD/.runtime/tmp"
          export TEMP="$TMPDIR" TMP="$TMPDIR"
          python3 -m venv .runtime/bootstrap
          .runtime/bootstrap/bin/python -m pip install --cache-dir .runtime/bootstrap-cache uv==0.12.19
          PATH="$PWD/.runtime/bootstrap/bin:$PATH" python3 scripts/dev.py check
