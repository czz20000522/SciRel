kind: scientific_task_graph
name: 直接各向异性参数反演
entrypoint: graph.py::run_graph
display_name:
  zh: 直接各向异性参数反演
  en: Direct Anisotropic Parameter Inversion
framework_mapping:
  primary_pfm_node: N10
  coverage: full
  related_pfm_nodes:
  - N6
  - N9
inputs:
- name: initial_params
  meaning: 起始 profile 参数 mapping
  shape: mapping
  units: mixed
  required: true
  constraints: contains all fit_keys finite scalars
- name: bounds
  meaning: 参数上下界 mapping
  shape: mapping[key->[lower,upper]]
  units: same_as_parameter
  required: true
  constraints: LHS needs finite increasing bounds
- name: observations
  meaning: 诊断请求或观测 mapping
  shape: mapping
  units: mixed
  required: true
  constraints: points [N,2]=[R,Z]
  fields:
    flux_loops:
      meaning: 磁通环请求或观测
      shape: mapping
      units: mixed
      required: false
      constraints: points [N,2]=[R,Z]
    thomson:
      meaning: Thomson 请求或观测
      shape: mapping
      units: mixed
      required: false
      constraints: points [N,2]=[R,Z]
- name: solver_config
  meaning: 不含每次 trial params 的 N6 输入 mapping
  shape: mapping
  units: mixed
  required: true
  constraints: explicit grid/vacuum/Green state
  fields:
    r_grid:
      meaning: N6 R 网格
      shape: '[N_Z,N_R]'
      units: m
      required: true
      constraints: same shape z_grid
    z_grid:
      meaning: N6 Z 网格
      shape: '[N_Z,N_R]'
      units: m
      required: true
      constraints: same shape r_grid
    psi_vac:
      meaning: N6 真空磁通
      shape: '[N_Z,N_R]'
      units: Wb
      required: true
      constraints: N6 contract
    br_vac:
      meaning: N6 真空径向场
      shape: '[N_Z,N_R]'
      units: T
      required: true
      constraints: N6 contract
    bz_vac:
      meaning: N6 真空轴向场
      shape: '[N_Z,N_R]'
      units: T
      required: true
      constraints: N6 contract
    g_psi:
      meaning: N6 flux Green 矩阵
      shape: '[N_field,N_field]'
      units: Wb/A
      required: true
      constraints: N6 contract
    tol:
      meaning: N6 Picard 收敛阈值
      shape: scalar
      units: dimensionless
      required: true
      constraints: finite positive; N6 required Picard convergence tolerance
    maxiter:
      meaning: N6 Picard 最大迭代次数
      shape: scalar_integer
      units: iteration
      required: true
      constraints: nonnegative; N6 required Picard iteration limit
    relax:
      meaning: N6 新旧 cell current 混合权重
      shape: scalar
      units: dimensionless
      required: true
      constraints: 0<=relax<=1; N6 required Picard relaxation
- name: equilibrium_solver
  meaning: 调用方 N6 callable
  shape: callable({**solver_config,params})->equilibrium
  units: caller_adapter
  required: true
  constraints: fresh trial state
- name: diagnostic_evaluator
  meaning: 调用方 N9 callable
  shape: callable({equilibrium,R,Z,observations})->predicted
  units: caller_adapter
  required: true
  constraints: reads solver_config R/Z
- name: fit_keys
  meaning: 被优化参数的顺序列表
  shape: '[N_fit] or null'
  units: identifier
  required: false
  constraints: default bounds key order
- name: method
  meaning: 直接优化器 selector
  shape: scalar_string
  units: dimensionless
  required: true
  constraints: least_squares or minimize
- name: n_initial_samples
  meaning: 可选 LHS 样本数
  shape: scalar_integer_or_null
  units: count
  required: false
  constraints: positive when supplied
- name: seed
  meaning: 可选 NumPy RNG seed
  shape: scalar_integer_or_null
  units: dimensionless
  required: false
  constraints: fixed seed reproducible
outputs:
- name: best_parameters
  meaning: 最低已记录 chi2 的参数 mapping
  shape: mapping
  units: same_as_initial_params
  required: true
  constraints: direct or LHS result
- name: chi2
  meaning: 最优归一化残差平方和
  shape: scalar
  units: dimensionless
  required: true
  constraints: finite or penalty 1e24
- name: residual_vector
  meaning: 最优归一化残差
  shape: '[N_residual]'
  units: dimensionless
  required: true
  constraints: failure penalty [1e12]
- name: converged
  meaning: 优化器成功且最佳嵌套平衡状态满足其自身收敛条件
  shape: scalar
  units: boolean
  required: true
  constraints: True 仅表示优化器返回成功且最佳嵌套 equilibrium 的 converged 为 True；本图不额外施加 residual <= tol
- name: equilibrium
  meaning: 只读平衡状态 mapping
  shape: mapping
  units: mixed
  required: true
  constraints: fields on caller [N_Z,N_R] grid
- name: evaluation_log
  meaning: 有序 LHS/optimizer 评估记录
  shape: '[N_eval]'
  units: mixed
  required: true
  constraints: LHS precedes optimizer
- name: failure_reason
  meaning: 显式失败状态
  shape: string_or_null
  units: dimensionless
  required: true
  constraints: 收敛时为空值；未收敛时返回声明的失败标记字符串
- name: optimizer_summary
  meaning: 可序列化 optimizer 摘要
  shape: mapping_or_null
  units: dimensionless
  required: true
  constraints: method/success/status/message/nfev
execution:
  mode: optional_latin_hypercube_then_direct_optimizer_with_explicit_cross_node_ports
  order_policy: lhs_initial_design_then_best_sample_then_equilibrium_then_diagnostics_then_residual_then_optimizer_feedback
  state_policy: each_trial_owns_parameter_mapping_and_receives_a_fresh_equilibrium_state
  failure_policy: nested_evaluation_exception_maps_to_one_element_1e12_residual_penalty
nodes:
- id: latin_hypercube_initial_design
  name: 可选拉丁超立方初始设计
  kind: scientific_operator
  callable: scirel.inference.latin_hypercube_sampling::sample_latin_hypercube
  asset_ref: scirel.inference.latin_hypercube_sampling
  inputs: [bounds, n_samples, seed, fit_keys]
  outputs: [lhs_sampler]
- id: equilibrium_solver_port
  name: 调用方平衡求解端口
  kind: io_config_action
  callable: caller:equilibrium_solver
  inputs: [solver_config_with_trial_params]
  outputs: [equilibrium_solver]
- id: diagnostic_evaluator_port
  name: 调用方合成诊断端口
  kind: io_config_action
  callable: caller:diagnostic_evaluator
  inputs: [equilibrium, R, Z, observations]
  outputs: [diagnostic_evaluator]
- id: residual_reducer_port
  name: 诊断观测残差归约
  kind: scientific_operator
  callable: scirel.diagnostics.observation_residuals::reduce_observation_residuals
  asset_ref: scirel.diagnostics.observation_residuals
  inputs: [predicted, observations]
  outputs: [residual_reducer]
- id: trial_evaluator_port
  name: 单次参数试探绑定
  kind: controlled_glue
  callable: glue:_evaluate_trial
  inputs: [params, observations, solver_config, equilibrium_solver, diagnostic_evaluator, residual_reducer]
  outputs: [trial_evaluator]
- id: direct_optimizer
  name: 有界直接优化
  kind: scientific_operator
  callable: scirel.inference.anisotropic_parameter_optimization::optimize_anisotropic_parameters
  asset_ref: scirel.inference.anisotropic_parameter_optimization
  inputs: [initial_params, bounds, method, trial_evaluator, fit_keys, lhs_sampler, n_initial_samples, seed]
  outputs: [best_parameters, chi2, residual_vector, converged, equilibrium, evaluation_log, failure_reason, optimizer_summary]
edges:
- from: equilibrium_solver_port
  from_output: equilibrium_solver
  to: trial_evaluator_port
  to_input: equilibrium_solver
  data: 调用方提供的平衡求解 callable
  condition: 每次 trial evaluation
  transform: 保留 callable，不预先执行
  closure: controlled_glue
- from: diagnostic_evaluator_port
  from_output: diagnostic_evaluator
  to: trial_evaluator_port
  to_input: diagnostic_evaluator
  data: 调用方提供的诊断求值 callable
  condition: 每次 trial evaluation
  transform: 保留 callable，不预先执行
  closure: controlled_glue
- from: residual_reducer_port
  from_output: residual_reducer
  to: trial_evaluator_port
  to_input: residual_reducer
  data: SciRel 残差归约 callable
  condition: 每次 trial evaluation
  transform: 保留 callable，不预先生成 residual_vector
  closure: controlled_glue
- from: trial_evaluator_port
  from_output: trial_evaluator
  to: direct_optimizer
  to_input: trial_evaluator
  data: 绑定观测、求解配置和三个 callable 端口后的 trial evaluator
  condition: 每次优化或 LHS evaluation
  transform: partial binding
  closure: controlled_glue
- from: latin_hypercube_initial_design
  from_output: lhs_sampler
  to: direct_optimizer
  to_input: lhs_sampler
  data: SciRel LHS sampler callable
  condition: 提供 n_initial_samples 时
  transform: 保留 callable；optimizer 负责执行和选择起点
  closure: controlled_glue
