kind: scientific_composition
name: 各向异性自由边界Picard平衡
entrypoint: composition_fixture.py::run_composition
display_name:
  zh: 各向异性自由边界 Picard 平衡
  en: Anisotropic Free-Boundary Picard Equilibrium
framework_mapping:
  primary_pfm_node: N6
  coverage: full
  related_pfm_nodes:
  - N1
  - N4
  - N5
  - N7
inputs:
- name: r_grid
  meaning: 柱坐标 R 网格
  shape: '[N_Z,N_R]'
  units: m
  required: true
  constraints: 有限、R非负的张量直角网格；第1轴严格递增，可非均匀；每轴至少3点
- name: z_grid
  meaning: 柱坐标 Z 网格
  shape: '[N_Z,N_R]'
  units: m
  required: true
  constraints: 有限张量直角网格；第0轴严格递增，可非均匀；每轴至少3点
- name: psi_vac
  meaning: 外加或真空磁通
  shape: '[N_Z,N_R]'
  units: Wb/rad
  required: true
  constraints: ravel matches Green field axis
- name: br_vac
  meaning: 真空径向磁场
  shape: '[N_Z,N_R]'
  units: T
  required: true
  constraints: finite
- name: bz_vac
  meaning: 真空轴向磁场
  shape: '[N_Z,N_R]'
  units: T
  required: true
  constraints: finite
- name: g_psi
  meaning: cell current 到 field flux dense Green 矩阵
  shape: '[N_field,N_field]'
  units: Wb/rad/A
  required: true
  constraints: row field; column source cell
- name: g_br
  meaning: 可选 cell current 到径向场 Green 矩阵
  shape: '[N_field,N_field] or null'
  units: T/A
  required: false
  constraints: paired with g_bz
- name: g_bz
  meaning: 可选 cell current 到轴向场 Green 矩阵
  shape: '[N_field,N_field] or null'
  units: T/A
  required: false
  constraints: paired with g_br
- name: params
  meaning: 调用方拥有的 Frank-Egedal 闭合配置
  shape: mapping
  units: mixed
  required: true
  constraints: no hidden files or global state
  fields:
    psi_axis:
      meaning: 径向包络磁通轴值
      shape: scalar
      units: same_as_psi
      required: false
      constraints: default min(psi)
    psi_edge:
      meaning: 径向包络磁通边值
      shape: scalar
      units: same_as_psi
      required: false
      constraints: default max(psi); distinct from psi_axis
    alpha:
      meaning: 径向包络指数
      shape: scalar
      units: dimensionless
      required: false
      constraints: default 1
    B0:
      meaning: 参考磁场
      shape: scalar
      units: T
      required: false
      constraints: default median(B); abs(B0) denominator
    p0:
      meaning: 热离子压强尺度别名
      shape: scalar
      units: Pa
      required: false
      constraints: alias hot_pressure_scale
    hot_pressure_scale:
      meaning: 热离子压强尺度
      shape: scalar
      units: Pa
      required: false
      constraints: p0 may supply same value
    gas_dynamic_pressure:
      meaning: 气体动力学压强尺度
      shape: scalar
      units: Pa
      required: false
      constraints: default 0
    background_density:
      meaning: 背景密度尺度别名
      shape: scalar
      units: m^-3
      required: false
      constraints: alias gas_dynamic_density
    gas_dynamic_density:
      meaning: 气体动力学密度尺度
      shape: scalar
      units: m^-3
      required: false
      constraints: background_density may supply same value
    hot_density_scale:
      meaning: 热离子密度尺度
      shape: scalar
      units: m^-3
      required: false
      constraints: optional
    electron_temperature:
      meaning: 常数电子温度
      shape: scalar
      units: caller_density_compatible
      required: false
      constraints: density product pressure-compatible
    mirror_ratio:
      meaning: 损失锥镜比
      shape: scalar
      units: dimensionless
      required: false
      constraints: source-valid
    turning_b:
      meaning: 损失锥 turning-field 比
      shape: scalar
      units: dimensionless
      required: false
      constraints: overrides mirror_ratio
    vc_over_v0:
      meaning: 慢化临界速度比
      shape: scalar
      units: dimensionless
      required: false
      constraints: source-valid
    zeff:
      meaning: 有效离子电荷别名
      shape: scalar
      units: dimensionless
      required: false
      constraints: alias beta_m
    beta_m:
      meaning: 损失锥参数覆盖项
      shape: scalar
      units: dimensionless
      required: false
      constraints: overrides zeff
    legendre_degrees:
      meaning: 调用方给定分数 Legendre degree
      shape: '[mode]'
      units: dimensionless
      required: false
      constraints: bypasses spectrum leaf
    legendre_mode_count:
      meaning: 缺省损失锥谱模态数
      shape: scalar_integer
      units: count
      required: false
      constraints: default 6
    legendre_spectrum_grid_points:
      meaning: 缺省损失锥谱角向单元数
      shape: scalar_integer
      units: count
      required: false
      constraints: default 256
    source_coefficients:
      meaning: NBI 模态幅度
      shape: '[mode]'
      units: dimensionless
      required: false
      constraints: same shape as degrees
    nbi_pitch_angle_deg:
      meaning: 缺省 NBI 源角
      shape: scalar
      units: deg
      required: false
      constraints: default 45
    legendre_terms:
      meaning: P/Q 多项式保留项数
      shape: scalar_integer
      units: count
      required: false
      constraints: default 15
    velocity_nodes:
      meaning: 速度积分节点数
      shape: scalar_integer
      units: count
      required: false
      constraints: default 24
    pitch_nodes:
      meaning: pitch 积分节点数
      shape: scalar_integer
      units: count
      required: false
      constraints: default 24
- name: pressure_closure
  meaning: 调用方提供的 N4 闭合 callable
  shape: callable({psi,B,params})->mapping
  units: caller_adapter
  required: true
  constraints: returns p_parallel,p_perp,density,electron_temperature
- name: tol
  meaning: Picard 停止阈值
  shape: scalar
  units: dimensionless
  required: true
  constraints: 必须为有限且严格为正的标量
- name: maxiter
  meaning: 最大 Picard 次数
  shape: scalar_integer
  units: iteration
  required: true
  constraints: 必须为非负整数标量；不接受浮点数或布尔值；0 表示不执行 Picard 更新
- name: relax
  meaning: 新旧 cell current 混合权重
  shape: scalar
  units: dimensionless
  required: true
  constraints: 必须为有限标量，且满足 0 <= relax <= 1
- name: b0
  meaning: 闭合参考场
  shape: scalar_or_null
  units: T
  required: false
  constraints: default vacuum-field median
- name: plasma_mask
  meaning: 离散 cell current 的 plasma selector
  shape: '[N_Z,N_R]'
  units: boolean
  required: false
  constraints: false cells clipped
- name: boundary_correction
  meaning: 可选 N7 墙磁通修正配置
  shape: mapping_or_null
  units: mixed
  required: false
  constraints: 修正psi，并把相同墙磁通的离散磁场导数加入BR/BZ
  fields:
    boundary_sample_matrix:
      meaning: field flux 到 boundary samples 投影
      shape: '[N_boundary,N_field]'
      units: dimensionless
      required: true
      constraints: '[Z,R] ravel'
    green_boundary_to_boundary:
      meaning: wall current 到 boundary flux Green 矩阵
      shape: '[N_boundary,N_wall]'
      units: Wb/rad/A
      required: true
      constraints: finite
    green_boundary_to_field:
      meaning: wall current 到 field flux Green 矩阵
      shape: '[N_field,N_wall]'
      units: Wb/rad/A
      required: true
      constraints: finite
    rcond:
      meaning: 截断 SVD 相对阈值
      shape: scalar
      units: dimensionless
      required: false
      constraints: N7 default
- name: cell_edges
  meaning: 可选R和Z单元边界，代替节点梯形权重
  shape: ([N_R+1],[N_Z+1]) or null
  units: m
  required: false
  constraints: 同中心方向严格单调且有限；每中心落在对应边界内；R边界非负
- name: minimum_field
  meaning: 每次压力和电流计算前的磁场下界
  shape: scalar
  units: T
  required: false
  constraints: 有限严格正数，默认1e-8；低于下界在闭合回调前失败
- name: compatibility_tol
  meaning: 返回态平行压强力相容性阈值
  shape: scalar
  units: dimensionless
  required: false
  constraints: 有限非负数，默认0.05
- name: strict_compatibility
  meaning: 平行力不相容是否抛出错误
  shape: boolean
  units: boolean
  required: false
  constraints: 默认true，只接受布尔值
outputs:
- name: psi
  meaning: 当前或最终磁通
  shape: '[N_Z,N_R]'
  units: Wb/rad
  required: true
  constraints: finite [Z,R] field
- name: BR
  meaning: 最终径向磁场
  shape: '[N_Z,N_R]'
  units: T
  required: true
  constraints: 未提供成对场Green时从新增等离子体磁通导出BR增量；否则使用g_br投影；再加br_vac与墙增量
- name: BZ
  meaning: 最终轴向磁场
  shape: '[N_Z,N_R]'
  units: T
  required: true
  constraints: 未提供成对场Green时从新增等离子体磁通导出BZ增量；否则使用g_bz投影；再加bz_vac与墙增量
- name: B
  meaning: 局域或最终磁场强度
  shape: '[N_Z,N_R]'
  units: T
  required: true
  constraints: same grid as psi
- name: profiles
  meaning: 调用方 N4 压强闭合结果
  shape: mapping
  units: mixed
  required: true
  constraints: p_parallel/p_perp plus optional density/temperature
- name: j_phi
  meaning: 最终环向电流密度
  shape: '[N_Z,N_R]'
  units: A/m^2
  required: true
  constraints: plasma_mask applied
- name: plasma_currents
  meaning: 离散环向 cell current
  shape: '[N_Z,N_R]'
  units: A
  required: true
  constraints: '[Z,R] grid'
- name: picard_current_state
  meaning: 最后反馈的松弛 cell current
  shape: '[N_field]'
  units: A
  required: true
  constraints: '[Z,R] ravel order'
- name: gradp_term
  meaning: 电流压力梯度分项
  shape: '[N_Z,N_R]'
  units: A/m^2
  required: true
  constraints: same grid
- name: anisotropy_curvature_term
  meaning: 电流各向异性曲率分项
  shape: '[N_Z,N_R]'
  units: A/m^2
  required: true
  constraints: same grid
- name: converged
  meaning: Picard 收敛标志
  shape: scalar
  units: boolean
  required: true
  constraints: 至少一轮，完整未松弛psi/BR/BZ/电流残差<=tol，且平行力相容
- name: iterations
  meaning: 实际 Picard 次数
  shape: scalar_integer
  units: iteration
  required: true
  constraints: 0<=iterations<=maxiter
- name: residual
  meaning: 最终相对残差
  shape: scalar
  units: dimensionless
  required: true
  constraints: maxiter=0 时为 inf，表示没有执行更新；至少执行一轮后必须为有限值
- name: residual_history
  meaning: 每步相对残差
  shape: '[iterations]'
  units: dimensionless
  required: true
  constraints: length equals iterations
- name: parameters
  meaning: 本次实际使用的闭合参数
  shape: mapping
  units: mixed
  required: true
  constraints: only explicit B0 inserted
- name: boundary_currents
  meaning: 墙电流
  shape: '[N_wall] or null'
  units: A
  required: true
  constraints: wall branch only
- name: boundary_flux_correction
  meaning: 墙引起的磁通改变量
  shape: '[N_Z,N_R] or null'
  units: Wb/rad
  required: true
  constraints: wall branch only
- name: boundary_residual_norm
  meaning: 墙边界残差范数
  shape: scalar_or_null
  units: Wb/rad
  required: true
  constraints: 非墙分支返回 null；启用 boundary_correction 时返回有限标量
- name: failure_reason
  meaning: 显式失败状态
  shape: string_or_null
  units: dimensionless
  required: true
  constraints: 收敛时为空值；未收敛时返回声明的失败标记字符串
- name: fixed_point_residual
  meaning: 返回态psi、BR、BZ和电流未松弛残差的最大值
  shape: scalar
  units: dimensionless
  required: true
  constraints: 控制判停与收敛；各场分母是max目标/当前/真空范数，电流为max目标/当前范数；全零为零
- name: flux_fixed_point_residual
  meaning: 返回态未松弛psi固定点残差
  shape: scalar
  units: dimensionless
  required: true
  constraints: 非负有限L2比值
- name: field_fixed_point_residual
  meaning: 返回态未松弛BR和BZ残差的最大值
  shape: scalar
  units: dimensionless
  required: true
  constraints: 非负有限L2比值
- name: current_fixed_point_residual
  meaning: 返回态压力电流与已松弛电流状态的残差
  shape: scalar
  units: dimensionless
  required: true
  constraints: 非负有限L2比值
execution:
  mode: sequential_state_feedback_picard
  order_policy: field_state_to_pressure_to_current_to_relaxed_cell_current_to_green_projection_to_optional_flux_boundary_correction_to_next_field_state
  state_policy: composition_owns_psi_BR_BZ_currents_old_residual_history; caller_owns_vacuum_fields_green_matrices_and_profile_parameters
  failure_policy: invalid_ports_fail_closed; residual_above_tol_after_maxiter_returns_last_state_with_failure_reason_maxiter_reached
nodes:
- id: initial_state_contract
  name: 初始 R-Z、真空场与 Green 矩阵状态合同
  kind: io_config_action
  callable: composition_fixture.py::run_composition
  inputs:
  - r_grid
  - z_grid
  - psi_vac
  - br_vac
  - bz_vac
  - g_psi
  - g_br
  - g_bz
  - plasma_mask
  outputs:
  - psi_state
  - br_state
  - bz_state
  - currents_old
  - cell_area
- id: pressure_closure
  name: 调用方提供的 N4 Frank-Egedal 压强闭合端口
  kind: io_config_action
  callable: caller:pressure_closure
  inputs:
  - pressure_closure
  - psi_state
  - B_state
  - params
  outputs:
  - p_parallel
  - p_perp
  - density
  - electron_temperature
- id: current_source
  name: 各向异性压强张量环向电流
  kind: scientific_function
  callable: scirel.equilibrium.anisotropic_toroidal_current::compute_anisotropic_toroidal_current
  asset_ref: scirel.equilibrium.anisotropic_toroidal_current
  inputs:
  - r_grid
  - z_grid
  - br_state
  - bz_state
  - p_parallel
  - p_perp
  outputs:
  - j_phi
  - gradp_term
  - anisotropy_curvature_term
  - B
- id: current_relaxation
  name: 单元电流离散、Picard 松弛与 Green 场反馈
  kind: scientific_function
  callable: scirel.equilibrium.anisotropic_picard_feedback::update_anisotropic_picard_flux
  asset_ref: scirel.equilibrium.anisotropic_picard_feedback
  inputs:
  - j_phi
  - r_grid
  - z_grid
  - plasma_mask
  - g_psi
  - g_br
  - g_bz
  - psi_vac
  - br_vac
  - bz_vac
  - relax
  - currents_old
  outputs:
  - psi_projected
  - br_projected
  - bz_projected
  - j_phi_masked
  - plasma_currents
  - picard_current_state
- id: green_field_projection
  name: 极向磁场幅值
  kind: scientific_function
  callable: scirel.field.poloidal_field_magnitude::compute_poloidal_field_magnitude
  asset_ref: scirel.field.poloidal_field_magnitude
  inputs:
  - br_state
  - bz_state
  outputs:
  - B
  - B0_default
- id: ideal_boundary_correction
  name: 理想导体边界磁通修正
  kind: scientific_function
  callable: scirel.field.ideal_conductor_boundary::correct_ideal_conductor_boundary_flux
  asset_ref: scirel.field.ideal_conductor_boundary
  inputs:
  - psi_uncorrected
  - boundary_correction
  outputs:
  - psi_corrected
  - boundary_currents
  - boundary_flux_correction
  - boundary_residual_norm
- id: convergence
  name: 相对残差与 Picard 收敛
  kind: scientific_function
  callable: scirel.diagnostics.picard_flux_residual::compute_picard_flux_residual
  asset_ref: scirel.diagnostics.picard_flux_residual
  inputs:
  - psi_state
  - psi_next
  outputs:
  - residual
edges:
- from: initial_state_contract
  from_output: br_state
  to: green_field_projection
  to_input: br_state
  data: current radial field [Z,R]
  condition: initial state and every feedback iteration
  required: true
  transform: paired with bz_state to form B
  closure: asset
- from: initial_state_contract
  from_output: bz_state
  to: green_field_projection
  to_input: bz_state
  data: current axial field [Z,R]
  condition: initial state and every feedback iteration
  required: true
  transform: paired with br_state to form B
  closure: asset
- from: green_field_projection
  from_output: B
  to: pressure_closure
  to_input: B_state
  data: current field magnitude [Z,R]
  condition: every iteration
  required: true
  transform: caller-provided N4 closure consumes the actual feedback state
  closure: controlled_glue
- from: pressure_closure
  from_output: p_parallel
  to: current_source
  to_input: p_parallel
  data: current-state parallel pressure [Z,R]
  condition: every iteration
  required: true
  transform: identity
  closure: asset
- from: pressure_closure
  from_output: p_perp
  to: current_source
  to_input: p_perp
  data: current-state perpendicular pressure [Z,R]
  condition: every iteration
  required: true
  transform: identity
  closure: asset
- from: current_source
  from_output: j_phi
  to: current_relaxation
  to_input: j_phi
  data: toroidal current density [Z,R]
  condition: every iteration
  required: true
  transform: apply plasma_mask, 按节点梯形权重或显式cell_edges形成C-order环向电流，不乘2πR, relax against currents_old, then apply Green matrices
  closure: asset
- from: current_relaxation
  from_output: psi_projected
  to: ideal_boundary_correction
  to_input: psi_uncorrected
  data: uncorrected projected flux [Z,R]
  condition: boundary_correction supplied
  required: false
  transform: flatten only at the declared N7 adapter port
  closure: asset
- from: current_relaxation
  from_output: psi_projected
  to: convergence
  to_input: psi_next
  data: next flux without wall correction [Z,R]
  condition: boundary_correction absent
  required: true
  transform: identity
  closure: asset
- from: ideal_boundary_correction
  from_output: psi_corrected
  to: convergence
  to_input: psi_next
  data: wall-corrected next flux [Z,R]
  condition: boundary_correction supplied
  required: false
  transform: N7磁通修正及其离散磁場导数共同进入反馈态
  closure: asset
- from: current_relaxation
  from_output: psi_projected
  to: pressure_closure
  to_input: psi_state
  data: next flux state before optional wall correction
  condition: boundary_correction absent and fixed_point_residual > tol and iterations < maxiter
  required: true
  transform: state feedback only
  closure: controlled_glue
- from: ideal_boundary_correction
  from_output: psi_corrected
  to: pressure_closure
  to_input: psi_state
  data: wall-corrected next flux state
  condition: boundary_correction supplied and fixed_point_residual > tol and iterations < maxiter
  required: false
  transform: state feedback only
  closure: controlled_glue

feedback_contract:
  state: psi、BR、BZ、已松弛电流、步幅历史和已执行次数
  initialization: 真空场；电流为零；步幅残差为inf；历史为空
  ordering: 检查场下界→确定性闭合→电流→完整未松弛目标判停→电流松弛→Green场→墙磁通及同一导数场→下一态
  stop: 至少一轮后完整未松弛状态残差<=tol，或到达maxiter
  domain: 每次压力和电流求值前B>=minimum_field；闭合不改输入且对相同状态确定
  weights: 缺省节点梯形积分覆盖轴最小至最大；边点半邻距；显式cell_edges定义真实单元；无2πR
  residual: psi、BR、BZ各用差范数除max(目标范数、当前范数、对应真空范数)；电流除max(目标范数、当前范数)；全零为零；fixed_point_residual取全部最大
  nonconvergence: 返回最后完整态与maxiter_reached；平行力不相容可严格失败或返回parallel_force_incompatible
