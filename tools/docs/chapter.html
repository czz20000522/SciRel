<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轴对称线圈磁场 · SciRel 科学关系手册</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#000;background:#fff;font:16px/1.85 system-ui,-apple-system,sans-serif}a{color:#000;text-underline-offset:4px}header{border-bottom:1px solid #ddd;padding:16px 4%;display:flex;justify-content:space-between;gap:16px}header nav{display:flex;gap:24px;flex-wrap:wrap}.layout{max-width:1260px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:55px;padding:32px 4% 70px}aside{align-self:start;position:sticky;top:24px;font-size:14px}aside ol{list-style:none;padding:0}aside li{margin:14px 0}aside a{text-decoration:none}aside a:hover{text-decoration:underline}aside h2{font-size:16px}.tree details{margin:8px 0}.tree details details{margin-left:14px;border-left:1px solid #ddd;padding-left:12px}.tree summary{font-weight:500;line-height:1.6}.tree #toc{margin:8px 0 18px 6px;border-left:1px solid #ddd;padding-left:12px}.tree #toc li{margin:0}.tree #toc a{display:block;padding:7px 5px;font-size:13px;line-height:1.6}.tree #toc a[aria-current="location"]{font-weight:700;border-left:2px solid #000;margin-left:-14px;padding-left:17px}.tree #toc a:hover{background:#f4f4f4}.tree{margin-bottom:24px}main{min-width:0;max-width:830px}h1{font-size:36px;line-height:1.35;margin:12px 0 24px}h2{font-size:24px;line-height:1.5;margin:0 0 18px}h3{font-size:18px;margin:24px 0 8px}p{margin:12px 0}section{border-top:1px solid #ddd;margin-top:40px;padding-top:32px;scroll-margin-top:24px}.crumb{font-size:14px}.lead{font-size:18px}.formula{font:18px/1.8 Georgia,serif;padding:15px 0}pre{padding:18px;border:1px solid #ddd;background:#fff;font:13px/1.7 ui-monospace,monospace;overflow:auto}code{font-family:ui-monospace,monospace}figure{margin:24px 0}img{width:100%;height:auto;display:block}figcaption{font-size:14px;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}th{border-top:1px solid #000}ul{padding-left:22px}details{font-size:14px;overflow-wrap:anywhere}summary{cursor:pointer}button,input{background:white;color:black;border:1px solid #888;padding:9px;font:inherit}input{min-width:0;width:100%}button{cursor:pointer;flex-shrink:0;white-space:nowrap}form{display:flex;gap:6px}#search-results{padding-left:18px}footer{border-top:1px solid #ddd;font-size:13px;margin-top:40px;padding-top:18px}:focus-visible{outline:2px solid #000;outline-offset:3px}.result{border-left:2px solid #000;padding-left:16px}.small{font-size:14px}
@media(max-width:800px){.layout{grid-template-columns:1fr;gap:22px;padding:24px 5%}aside{position:static;border-bottom:1px solid #ddd;padding-bottom:14px}aside ol{columns:1}aside li{margin-top:0}h1{font-size:28px}h2{font-size:22px}header{flex-wrap:wrap}header nav{gap:16px}pre{font-size:12px}.formula{overflow-wrap:anywhere}table{font-size:12px}td,th{padding:7px}}@media print{header,aside{display:none}.layout{display:block}section{break-inside:auto}pre{white-space:pre-wrap}a{text-decoration:none}}
</style></head><body>
<header><strong>SciRel · 科学关系手册</strong><nav><a href="/">学习指南</a><a href="/reference">函数参考</a><a href="/api">Agent 查询</a></nav></header>
<div class="layout"><aside><nav class="tree" aria-label="学科目录"><h2>目录</h2><details open><summary>电磁学</summary><details open><summary>磁静力学</summary><details open><summary>轴对称线圈磁场</summary><ol id="toc"></ol></details></details></details></nav><form id="search"><input id="q" aria-label="搜索本章" placeholder="搜索本章"><button>查找</button></form><ul id="search-results" aria-live="polite"></ul></aside><main id="chapter"><p role="status">正在读取章节…</p></main></div>
<script>
'use strict';
function legacyLink(){if(location.hash.startsWith('#scirel.'))location.replace('/reference'+location.hash)}
window.addEventListener('hashchange',legacyLink);legacyLink();
const $=s=>document.querySelector(s), add=(p,t,s)=>{const n=document.createElement(t);if(s!==undefined)n.textContent=s;p.append(n);return n};
const table=(p,headers,rows)=>{const t=add(p,'table'),h=add(t,'tr');headers.forEach(x=>add(h,'th',x));rows.forEach(row=>{const r=add(t,'tr');row.forEach(x=>add(r,'td',x))});return t};
const mT=x=>(x*1000).toFixed(6).replace(/^-0\.000000$/, '0.000000');
async function start(){const response=await fetch('/api/chapter?id=magnetostatics');if(!response.ok)throw Error('章节读取失败');const envelope=await response.json(),c=envelope.document,r=c.results,main=$('#chapter');main.replaceChildren();add(main,'div',c.discipline.join(' / ')).className='crumb';add(main,'h1',c.title);add(main,'p',c.introduction).className='lead';add(main,'p',c.prerequisites);let u=add(main,'ul');c.conventions.forEach(x=>add(u,'li',x));add(main,'h3','准备');add(main,'pre',c.imports);add(main,'p','下面的代码来自同一份已运行脚本，各小节共享变量。');
const entries=[];function section(id,title){const s=add(main,'section');s.id=id;add(s,'h2',title);const li=add($('#toc'),'li'),a=add(li,'a',title);a.href='#'+id;entries.push({id,title,element:s});return s}
for(const part of c.sections){const s=section(part.id,part.title);add(s,'p',part.problem);add(s,'p',part.method);if(part.formula)add(s,'p',part.formula).className='formula';add(s,'pre',part.code);add(s,'h3','运行结果');const result=add(s,'div');result.className='result';
if(part.result_key==='single')add(result,'p','中心 Bz = '+mT(r.center_single_T)+' mT；141 个轴上点与解析公式的最大绝对差为 '+r.checks.axis_max_abs_error_T.toExponential(3)+' T。');
if(part.result_key==='pair')table(result,['通电方式','中心 Bz / mT'],[['同向，每环 1000 A',mT(r.center_pair_T)],['反向，+1000 A 与 −1000 A',mT(r.opposed_BZ_T[70])]]);
if(part.result_key==='rectangle')add(result,'p','每组 64 根细丝，共 128 根；观测网格为 101 × 61。中心 Bz = '+mT(r.refinement_center_T[2])+' mT。');
if(part.result_key==='checks'){table(result,['每组离散','中心 Bz / mT','相对上一行变化'],r.refinement_n.map((n,i)=>[n+' × '+n,mT(r.refinement_center_T[i]),i?((r.refinement_center_T[i]-r.refinement_center_T[i-1])/r.refinement_center_T[i-1]*100).toFixed(4)+'%':'—']));add(result,'p','轴上公式、几何对称性、电流线性叠加和有限值检查均通过。中平面径向场最大绝对值 '+r.checks.pair_midplane_max_abs_BR_T+' T；电流加倍关系最大绝对差 '+r.checks.double_current_max_abs_error_T+' T。');}
if(part.figure){const f=add(s,'figure'),img=add(f,'img');img.src='/chapters/magnetostatics/'+part.figure;img.alt=part.caption;add(f,'figcaption',part.caption)}add(s,'h3','如何理解');add(s,'p',part.interpretation);}
let s=section('limits','5. 适用范围与常见误用');u=add(s,'ul');c.limitations.forEach(x=>add(u,'li',x));
s=section('reference','6. 复现与函数参考');add(s,'p',c.run);const links=add(s,'p');[['完整 Python 脚本','example.py'],['实际结果 JSON','results.json']].forEach(([label,path])=>{const a=add(links,'a',label);a.href='/chapters/magnetostatics/'+path;a.download=path;links.append('　')});add(s,'pre','python example.py results.json');u=add(s,'ul');c.assets.forEach(x=>{const a=add(add(u,'li'),'a',x.purpose);a.href='/reference#'+x.id});const d=add(s,'details');add(d,'summary','版本、执行记录与来源');add(d,'p','本章采用现有磁场实现。出处与许可可在各函数的正式合同中查询。此处保留复现身份，不据案例运行推定全部科学能力已验证。');add(d,'pre',JSON.stringify(c.execution,null,2));const a=add(s,'a','读取同一章节的 Agent JSON');a.href='/api/chapter?id=magnetostatics';add(main,'footer','本章为已运行的开发示范；具体使用范围见上文与函数合同。');
$('#search').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim().toLowerCase(),out=$('#search-results');out.replaceChildren();if(!q)return;const hits=entries.filter(x=>x.element.textContent.toLowerCase().includes(q));hits.forEach(x=>{const a=add(add(out,'li'),'a',x.title);a.href='#'+x.id});if(!hits.length)add(out,'li','本章无匹配内容。可前往函数参考检索。')};
const linksById=new Map([...document.querySelectorAll('#toc a')].map(a=>[a.hash.slice(1),a]));function mark(id){linksById.forEach((a,key)=>{if(key===id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}const observer=new IntersectionObserver(items=>{for(const item of items)if(item.isIntersecting)mark(item.target.id)},{rootMargin:'-5% 0px -65% 0px'});entries.forEach(x=>observer.observe(x.element));linksById.forEach((a,id)=>a.addEventListener('click',()=>mark(id)));
if(location.hash){if(location.hash.startsWith('#scirel.'))location.replace('/reference'+location.hash);else document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView()}}
start().catch(e=>{$('#chapter').replaceChildren();add($('#chapter'),'p',e.message)});
</script></body></html>
