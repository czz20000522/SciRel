<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轴对称线圈磁场 · SciRel 科学关系手册</title>
<link rel="stylesheet" href="/static/guide.css"><link rel="stylesheet" href="/static/code.css"></head><body>
<a class="skip-link" href="#chapter">跳到正文</a>
<header><strong>SciRel · 科学关系手册</strong><nav><a href="/">学习指南</a><a href="/reference">函数参考</a><a href="/api">Agent 查询</a></nav></header>
<div class="layout"><aside><nav class="tree" aria-label="学科目录"><h2>目录</h2><details open><summary>电磁学</summary><details open><summary>磁静力学</summary><details open><summary>轴对称线圈磁场</summary><ol id="toc"></ol></details></details></details></nav><form id="search"><input id="q" aria-label="搜索本章" placeholder="搜索本章"><button>查找</button></form><ul id="search-results" aria-live="polite"></ul></aside><main id="chapter"><p role="status">正在读取章节…</p></main></div>
<script src="/static/vendor/highlightjs/highlight.min.js"></script>
<script src="/static/presentation.js"></script>
<script src="/static/navigation.js"></script>
<script>
'use strict';
function legacyLink(){if(location.hash.startsWith('#scirel.'))location.replace('/reference'+location.hash)}
window.addEventListener('hashchange',legacyLink);legacyLink();
const $=s=>document.querySelector(s), add=(p,t,s)=>{const n=document.createElement(t);if(s!==undefined)n.textContent=s;p.append(n);return n};
const table=(p,headers,rows)=>{const t=add(p,'table'),h=add(t,'tr');headers.forEach(x=>add(h,'th',x));rows.forEach(row=>{const r=add(t,'tr');row.forEach(x=>add(r,'td',x))});return t};
const mT=x=>(x*1000).toFixed(6).replace(/^-0\.000000$/, '0.000000');
async function start(){const response=await fetch('/api/chapter?id=magnetostatics');if(!response.ok)throw Error('章节读取失败');const envelope=await response.json(),c=envelope.document,r=c.results,main=$('#chapter');main.replaceChildren();add(main,'div',c.discipline.join(' / ')).className='crumb';add(main,'h1',c.title);add(main,'p',c.introduction).className='lead';add(main,'p',c.prerequisites);let u=add(main,'ul');c.conventions.forEach(x=>add(u,'li',x));add(main,'h3','准备');add(main,'pre',c.imports).dataset.language='python';add(main,'p','下面的代码来自同一份已运行脚本，各小节共享变量。');
const entries=[];function section(id,title){const s=add(main,'section');s.id=id;add(s,'h2',title);const li=add($('#toc'),'li'),a=add(li,'a',title);a.href='#'+id;entries.push({id,title,element:s});return s}
for(const part of c.sections){const s=section(part.id,part.title);add(s,'p',part.problem);add(s,'p',part.method);if(part.formula){const f=add(s,'div');f.className='formula';if(part.formula_mathml)ScirelPresentation.formula(f,part.formula_mathml,part.formula);else f.textContent=part.formula;if(part.formula_note)add(s,'p',part.formula_note).className='formula-note';}add(s,'pre',part.code).dataset.language='python';add(s,'h3','运行结果');const result=add(s,'div');result.className='result';
if(part.result_key==='single')add(result,'p','中心 Bz = '+mT(r.center_single_T)+' mT；141 个轴上点与解析公式的最大绝对差为 '+r.checks.axis_max_abs_error_T.toExponential(3)+' T。');
if(part.result_key==='pair')table(result,['通电方式','中心 Bz / mT'],[['同向，每环 1000 A',mT(r.center_pair_T)],['反向，+1000 A 与 −1000 A',mT(r.opposed_BZ_T[70])]]);
if(part.result_key==='rectangle')add(result,'p','每组 64 根细丝，共 128 根；观测网格为 101 × 61。中心 Bz = '+mT(r.refinement_center_T[2])+' mT。');
if(part.result_key==='checks'){table(result,['每组离散','中心 Bz / mT','相对上一行变化'],r.refinement_n.map((n,i)=>[n+' × '+n,mT(r.refinement_center_T[i]),i?((r.refinement_center_T[i]-r.refinement_center_T[i-1])/r.refinement_center_T[i-1]*100).toFixed(4)+'%':'—']));add(result,'p','轴上公式、几何对称性、电流线性叠加和有限值检查均通过。中平面径向场最大绝对值 '+r.checks.pair_midplane_max_abs_BR_T+' T；电流加倍关系最大绝对差 '+r.checks.double_current_max_abs_error_T+' T。');}
if(part.figure){const f=add(s,'figure'),img=add(f,'img');img.src='/chapters/magnetostatics/'+part.figure;img.alt=part.caption;add(f,'figcaption',part.caption)}add(s,'h3','如何理解');add(s,'p',part.interpretation);}
let s=section('limits','5. 适用范围与常见误用');u=add(s,'ul');c.limitations.forEach(x=>add(u,'li',x));
s=section('reference','6. 复现与函数参考');add(s,'p',c.run);const links=add(s,'p');[['完整 Python 脚本','example.py'],['实际结果 JSON','results.json']].forEach(([label,path])=>{const a=add(links,'a',label);a.href='/chapters/magnetostatics/'+path;a.download=path;links.append('　')});add(s,'pre','python example.py results.json').dataset.language='bash';u=add(s,'ul');c.assets.forEach(x=>{const a=add(add(u,'li'),'a',x.purpose);a.href='/reference#'+x.id});const d=add(s,'details');add(d,'summary','版本、执行记录与来源');add(d,'p','本章采用现有磁场实现。出处与许可可在各函数的正式合同中查询。此处保留复现身份，不据案例运行推定全部科学能力已验证。');add(d,'pre',JSON.stringify(c.execution,null,2)).dataset.language='json';const a=add(s,'a','读取同一章节的 Agent JSON');a.href='/api/chapter?id=magnetostatics';add(main,'footer','本章为已运行的开发示范；具体使用范围见上文与函数合同。');
ScirelPresentation.enhance(main);
await ScirelNavigation.mount(document.querySelector('.tree'), {tutorial: 'magnetostatics', toc: document.querySelector('#toc')});
$('#search').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim().toLowerCase(),out=$('#search-results');out.replaceChildren();if(!q)return;const hits=entries.filter(x=>x.element.textContent.toLowerCase().includes(q));hits.forEach(x=>{const a=add(add(out,'li'),'a',x.title);a.href='#'+x.id});if(!hits.length)add(out,'li','本章无匹配内容。可前往函数参考检索。')};
const linksById=new Map([...document.querySelectorAll('#toc a')].map(a=>[a.hash.slice(1),a]));function mark(id){linksById.forEach((a,key)=>{if(key===id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}const observer=new IntersectionObserver(items=>{for(const item of items)if(item.isIntersecting)mark(item.target.id)},{rootMargin:'-5% 0px -65% 0px'});entries.forEach(x=>observer.observe(x.element));linksById.forEach((a,id)=>a.addEventListener('click',()=>mark(id)));
if(location.hash){if(location.hash.startsWith('#scirel.'))location.replace('/reference'+location.hash);else document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView()}}
start().catch(e=>{$('#chapter').replaceChildren();add($('#chapter'),'p',e.message)});
</script></body></html>
