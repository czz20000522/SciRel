[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scirel"
version = "0.1.0.dev11"
description = "Scientific Relations Library"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "mpmath==1.4.1"]
license-files = ["licenses/**/*"]

[project.optional-dependencies]
plot = ["matplotlib==3.11.2"]
netcdf = ["netCDF4==1.7.4"]

[dependency-groups]
build = ["setuptools==84.0.0", "wheel==0.48.0"]
optional-runtime-deps = [
    "matplotlib==3.11.2",
    "netCDF4==1.7.4",
]
test = [
    { include-group = "build" },
    { include-group = "optional-runtime-deps" },
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scirel", "scirel.*"]

[tool.setuptools.package-data]
"scirel.kinetic" = ["_fluidbw_native/*.m"]
"scirel.kinetic.pdrk" = [
    "_native/scirel_prepare_plot.m",
    "_native/current/**/*",
    "_native/examples/*",
    "_native/finiteN/*",
    "_native/legacy/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "provenance", "skills"]
addopts = "-p no:cacheprovider"
pythonpath = ["src", "tests"]
