[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scirel"
version = "0.1.0.dev5"
description = "Scientific Relations Library"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "matplotlib==3.11.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "setuptools==84.0.0", "wheel==0.48.0",
        "mpmath==1.4.1", "netCDF4==1.7.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scirel", "scirel.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "provenance", "skills"]
addopts = "-p no:cacheprovider"
pythonpath = ["src", "tests"]
