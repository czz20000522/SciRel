name: scirel-dev

services:
  dev:
    image: scirel-dev-python:${SCIReL_IMAGE_KEY:-local}
    build:
      context: ../..
      dockerfile: containers/dev/Dockerfile
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    working_dir: /workspace
    volumes:
      - type: bind
        source: ../..
        target: /workspace
      - type: volume
        source: scirel-venv
        target: /opt/scirel-venv
      - type: volume
        source: uv-cache
        target: /root/.cache/uv
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/scirel-pycache
      RUFF_CACHE_DIR: /tmp/scirel-ruff-cache
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: /opt/scirel-venv
      UV_PYTHON_DOWNLOADS: never
      UV_HTTP_TIMEOUT: "120"
      HTTP_PROXY: ${SCIReL_HTTP_PROXY:-}
      HTTPS_PROXY: ${SCIReL_HTTPS_PROXY:-}
      ALL_PROXY: ${SCIReL_ALL_PROXY:-}
      NO_PROXY: ${SCIReL_NO_PROXY:-localhost,127.0.0.1,::1}
      http_proxy: ${SCIReL_HTTP_PROXY:-}
      https_proxy: ${SCIReL_HTTPS_PROXY:-}
      all_proxy: ${SCIReL_ALL_PROXY:-}
      no_proxy: ${SCIReL_NO_PROXY:-localhost,127.0.0.1,::1}
    command: ["bash"]

volumes:
  scirel-venv:
  uv-cache:
